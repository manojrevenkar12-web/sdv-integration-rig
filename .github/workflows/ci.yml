name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest scapy==2.6.1
      - name: Rust decoder
        working-directory: tools/isotp-trace
        run: cargo test --release && cargo build --release
      - run: python -m pytest -m "not slow"
      - name: Robust flasher on the whole dev set
        run: python -m pytest -m slow
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
